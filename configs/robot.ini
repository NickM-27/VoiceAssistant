[*]

; Set Chat Template
jinja = true

; GPU Performance
n-gpu-layers = -1
flash-attn = on
fit = off

; Overall Performance
prio = 3
prio-batch = 3

; Increased Batch Size
batch-size = 2048
ubatch-size = 1024

; Set reasonable max thinking budgets
reasoning-budget = 3000
reasoning-budget-message = '... Taking too long, need to answer.'

[unsloth/gemma-4-26B-A4B-GGUF:Q5_K_S]

; Alias
alias = Gemma4

; Model Name
hf = unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q5_K_S

; Use Q8_0 mmproj from ggml-org for less VRAM
mmproj = /root/.cache/huggingface/hub/mmproj-gemma-4-26B-A4B-it-Q8_0.gguf

; Basic & K4V Spec Decoding
spec-type = ngram-mod,ngram-map-k4v

;; MTP Spec Decoding
;spec-draft-model = /root/.cache/huggingface/hub/mtp-gemma4-assistant_Q8.gguf
;spec-draft-n-max = 4

;; Basic Spec Decoding
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 24
spec-ngram-mod-n-max = 64

;; K4V Map Spec Decoding
spec-ngram-map-k4v-size-n = 10
spec-ngram-map-k4v-size-m = 32
spec-ngram-map-k4v-min-hits = 2

; Tuning
temp = 1.0
top-p = 0.95
top-k = 64

; Image Tuning
image-min-tokens = 560
image-max-tokens = 1020

; Context Size
ctx-size = 88000
parallel = 3
kvu = on
cache-ram = 0

; Model Load Behavior
load-on-startup = true
