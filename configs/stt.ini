[*]

; Set Chat Template
jinja = true

; GPU Performance
n-gpu-layers = -1
flash-attn = on
fit = off

; Overall Performance
prio = 3
prio-batch = 3

; Increased Batch Size
threads = 4 
batch-size = 2048
ubatch-size = 1024

[unsloth/gemma-4-E4B-it-GGUF:Q6_K_XL]

; Alias
alias = Gemma4-ASR

; Model Name
hf = unsloth/gemma-4-E4B-it-GGUF:UD-Q6_K_XL

; Basic & K4V Spec Decoding
spec-type = ngram-mod,ngram-map-k4v

;; Basic Spec Decoding
spec-ngram-mod-n-match = 12
spec-ngram-mod-n-min = 24
spec-ngram-mod-n-max = 48

;; K4V Map Spec Decoding
spec-ngram-map-k4v-size-n = 8
spec-ngram-map-k4v-size-m = 16
spec-ngram-map-k4v-min-hits = 2

; Disable Reasoning
reasoning = off

; Tuning
top-k = 64
top-p = 0.95

; Context Size
ctx-size = 896
parallel = 1
cache-ram = 0

; Model Load Behavior
load-on-startup = true
