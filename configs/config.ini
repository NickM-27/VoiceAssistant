[*]

; Set Chat Template
jinja = true

; GPU Performance
n-gpu-layers = -1
flash-attn = on
fit = off

; Overall Performance
prio = 3
prio-batch = 3

; Increased Batch Size
batch-size = 2048
ubatch-size = 1024

; Set reasonable max thinking budgets
reasoning-budget-message = '... Taking too long, need to answer.'

[unsloth/gemma-4-26B-A4B-it-qat-GGUF:Q4_K_XL]

; Alias
alias = Gemma4

; Model Name
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL

; Basic & K4V Spec Decoding
spec-type = draft-mtp,ngram-mod,ngram-map-k4v

;; Basic Spec Decoding
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 24
spec-ngram-mod-n-max = 64

;; K4V Map Spec Decoding
spec-ngram-map-k4v-size-n = 10
spec-ngram-map-k4v-size-m = 32
spec-ngram-map-k4v-min-hits = 2

; Tuning
temp = 1.0
top-p = 0.95
top-k = 64

; Image Tuning
image-min-tokens = 560
image-max-tokens = 1020

; Context Size
ctx-size = 128000
parallel = 6
cache-idle-slots = off
kvu = on
cache-ram = 4096

; Model Load Behavior
load-on-startup = true

[ggml-org/Qwen3-ASR-1.7B-GGUF:Q8_0]

; Alias
alias = Qwen3-ASR

; Model Name
hf = ggml-org/Qwen3-ASR-1.7B-GGUF:Q8_0

; Context Size
ctx-size = 896
parallel = 1
cache-ram = 0

; Model Load Behavior
load-on-startup = true
no-webui = true